<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 450" width="100%" height="100%" fill="none" style="font-family: 'JetBrains Mono', 'Source Sans 3', monospace;">
  <defs>
    <!-- Technical Glows -->
    <filter id="mv-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="mv-glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="mv-glow-plane" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="mv-surface-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="mv-plane-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.10" />
    </linearGradient>

    <radialGradient id="mv-backdrop-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#00e5ff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="290" cy="225" r="200" fill="url(#mv-backdrop-aura)" />

  <!-- Base xy-Plane Coordinate Projection Grid -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.2">
    <!-- Parallelogram xy-plane -->
    <polygon points="110,360 380,360 480,270 210,270" fill="#0284c7" fill-opacity="0.03" />
    <!-- xy-Grid lines -->
    <line x1="160" y1="360" x2="260" y2="270" stroke-dasharray="3 3" />
    <line x1="220" y1="360" x2="320" y2="270" stroke-dasharray="3 3" />
    <line x1="280" y1="360" x2="380" y2="270" stroke-dasharray="3 3" />
    <line x1="340" y1="360" x2="440" y2="270" stroke-dasharray="3 3" />

    <line x1="135" y1="337" x2="405" y2="337" stroke-dasharray="3 3" />
    <line x1="160" y1="315" x2="430" y2="315" stroke-dasharray="3 3" />
    <line x1="185" y1="292" x2="455" y2="292" stroke-dasharray="3 3" />

    <!-- Contour Level Curves Projected on xy-Plane -->
    <ellipse cx="295" cy="315" rx="100" ry="32" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" fill="none" />
    <ellipse cx="295" cy="315" rx="60" ry="20" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8" fill="none" />
    <text x="402" y="318" fill="#38bdf8" font-size="9">f(x,y)=k</text>
  </g>

  <!-- 3D Coordinate Reference Axes: X, Y, Z -->
  <g stroke="#64748b" stroke-width="1.6" opacity="0.85">
    <!-- Z-Axis (Vertical Altitude) -->
    <line x1="200" y1="380" x2="200" y2="50" />
    <polygon points="200,42 196,52 204,52" fill="#64748b" />
    <text x="195" y="36" fill="#94a3b8" font-size="13" font-weight="700">z</text>

    <!-- X-Axis (Isometric Oblique Forward-Left) -->
    <line x1="200" y1="330" x2="70" y2="385" />
    <polygon points="63,388 74,389 77,380" fill="#64748b" />
    <text x="50" y="398" fill="#94a3b8" font-size="13" font-weight="700">x</text>

    <!-- Y-Axis (Isometric Oblique Right) -->
    <line x1="200" y1="330" x2="520" y2="330" />
    <polygon points="526,330 516,326 516,334" fill="#64748b" />
    <text x="532" y="334" fill="#94a3b8" font-size="13" font-weight="700">y</text>

    <text x="186" y="342" fill="#64748b" font-size="11">0</text>
  </g>

  <!-- 3D Multivariable Surface: z = f(x, y) (Smooth Parametric Paraboloid / Saddle Mesh) -->
  <!-- Surface Fill Shading -->
  <path d="M 120 310 C 150 210, 220 150, 310 150 C 410 150, 470 210, 500 310 C 430 350, 340 370, 260 370 C 180 370, 140 340, 120 310 Z"
    fill="url(#mv-surface-grad)" />

  <!-- 3D U-Direction Grid Ribs (Cross-Sections y = const) -->
  <g stroke="#0284c7" stroke-width="1.2" opacity="0.65" fill="none">
    <path d="M 150 280 C 180 180, 250 140, 330 140 C 400 140, 450 180, 470 270" />
    <path d="M 135 295 C 165 200, 235 155, 320 155 C 405 155, 460 200, 485 285" stroke="#00e5ff" stroke-width="1.4" />
    <path d="M 120 310 C 150 220, 220 170, 310 170 C 410 170, 470 220, 500 310" />
    <path d="M 140 330 C 170 250, 230 200, 300 200 C 380 200, 440 250, 470 330" />
    <path d="M 170 350 C 200 290, 250 250, 300 250 C 350 250, 400 290, 430 350" />
  </g>

  <!-- 3D V-Direction Grid Ribs (Cross-Sections x = const) -->
  <g stroke="#0369a1" stroke-width="1.1" opacity="0.55" fill="none">
    <path d="M 160 210 C 180 260, 200 310, 220 360" />
    <path d="M 210 170 C 230 220, 250 280, 270 365" />
    <path d="M 265 150 C 285 200, 305 270, 320 365" stroke="#38bdf8" />
    <path d="M 325 145 C 345 200, 360 270, 375 355" stroke="#38bdf8" />
    <path d="M 385 160 C 400 215, 415 280, 425 340" />
    <path d="M 440 195 C 455 240, 465 295, 470 330" />
  </g>

  <!-- Surface Function Callout -->
  <text x="440" y="160" fill="#00e5ff" font-size="13" font-weight="700" filter="url(#mv-glow-cyan)">z = f(x, y)</text>

  <!-- Surface Point P(x₀, y₀, z₀) and Projection to Base -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" opacity="0.7">
    <!-- Vertical drop from P down to xy-plane -->
    <line x1="310" y1="180" x2="310" y2="320" />
    <!-- Projection lines in xy-plane to x and y axes -->
    <line x1="310" y1="320" x2="200" y2="320" />
    <line x1="310" y1="320" x2="245" y2="355" />
    <circle cx="310" cy="320" r="3" fill="#64748b" />
    <text x="316" y="332" fill="#94a3b8" font-size="10">(x₀, y₀, 0)</text>
  </g>

  <!-- Tangent Plane at Point P: Glassmorphic Translucent Rhombus -->
  <g filter="url(#mv-glow-plane)">
    <polygon points="210,195 350,140 410,165 270,220"
      fill="url(#mv-plane-glass)" stroke="#a855f7" stroke-width="1.8" />
  </g>
  <text x="380" y="145" fill="#c084fc" font-size="10" font-weight="600">Tangent Plane</text>

  <!-- Partial Derivative Vector: ∂f/∂x (Along x-direction) -->
  <g stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round">
    <line x1="310" y1="180" x2="250" y2="204" />
    <polygon points="243,207 253,201 254,210" fill="#38bdf8" />
  </g>
  <text x="212" y="218" fill="#38bdf8" font-size="11" font-weight="700">∂f/∂x</text>

  <!-- Partial Derivative Vector: ∂f/∂y (Along y-direction) -->
  <g stroke="#00e5ff" stroke-width="2.8" stroke-linecap="round">
    <line x1="310" y1="180" x2="380" y2="168" />
    <polygon points="387,167 375,163 377,172" fill="#00e5ff" />
  </g>
  <text x="388" y="180" fill="#00e5ff" font-size="11" font-weight="700">∂f/∂y</text>

  <!-- 3D Normal Vector / Gradient Vector: ∇f (Perpendicular Upward) -->
  <g filter="url(#mv-glow-amber)">
    <line x1="310" y1="180" x2="310" y2="90" stroke="#f59e0b" stroke-width="3.6" stroke-linecap="round" />
    <polygon points="310,80 304,95 316,95" fill="#f59e0b" />
    <!-- Right-angle symbol at base of normal vector -->
    <path d="M 310 165 L 322 162 L 322 177" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.85" />
  </g>
  <text x="322" y="85" fill="#fbbf24" font-size="12" font-weight="700">∇f = ⟨fx, fy⟩</text>

  <!-- Point P(x₀, y₀, z₀) Glowing Beacon -->
  <circle cx="310" cy="180" r="5" fill="#ffffff" stroke="#00e5ff" stroke-width="2.5" filter="url(#mv-glow-cyan)" />
  <text x="318" y="196" fill="#ffffff" font-size="11" font-weight="700">P(x₀, y₀, z₀)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%" fill="none" style="font-family: 'JetBrains Mono', 'Source Sans 3', monospace;">
  <defs>
    <!-- Technical Glowing Filters -->
    <filter id="mat-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="mat-glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shading Gradients -->
    <linearGradient id="mat-riemann-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="mat-curve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <radialGradient id="mat-aura" cx="52%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="300" cy="220" r="190" fill="url(#mat-aura)" />

  <!-- Technical Coordinate Grid -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.16">
    <!-- Horizontal Gridlines -->
    <line x1="50" y1="70" x2="530" y2="70" />
    <line x1="50" y1="120" x2="530" y2="120" />
    <line x1="50" y1="170" x2="530" y2="170" />
    <line x1="50" y1="220" x2="530" y2="220" />
    <line x1="50" y1="270" x2="530" y2="270" />
    <line x1="50" y1="320" x2="530" y2="320" />
    <line x1="50" y1="370" x2="530" y2="370" />

    <!-- Vertical Gridlines -->
    <line x1="90" y1="50" x2="90" y2="390" />
    <line x1="150" y1="50" x2="150" y2="390" />
    <line x1="210" y1="50" x2="210" y2="390" />
    <line x1="270" y1="50" x2="270" y2="390" />
    <line x1="330" y1="50" x2="330" y2="390" />
    <line x1="390" y1="50" x2="390" y2="390" />
    <line x1="450" y1="50" x2="450" y2="390" />
    <line x1="510" y1="50" x2="510" y2="390" />
  </g>

  <!-- Conic Section: Precise Analytical Ellipse (x²/a² + y²/b² = 1) -->
  <g opacity="0.4">
    <ellipse cx="370" cy="270" rx="120" ry="65" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="6 4" fill="none" transform="rotate(-15 370 270)" />
    <!-- Foci F1, F2 -->
    <circle cx="300" cy="290" r="3" fill="#c084fc" />
    <circle cx="440" cy="250" r="3" fill="#c084fc" />
    <text x="290" y="310" fill="#a855f7" font-size="10" font-weight="600">F₁</text>
    <text x="445" y="245" fill="#a855f7" font-size="10" font-weight="600">F₂</text>
  </g>

  <!-- Parabolic Directrix & Axis of Symmetry -->
  <g opacity="0.3" stroke="#6366f1" stroke-width="1">
    <path d="M 120 80 Q 230 380 470 330" fill="none" stroke-dasharray="4 4" />
  </g>

  <!-- Definite Integral: Riemann Sum Rectangles & Continuous Shading -->
  <g>
    <!-- Continuous Shaded Area ∫ f(x) dx -->
    <path d="M 150 320 L 150 250 C 185 165, 230 135, 270 170 C 310 205, 345 280, 390 300 L 390 320 Z"
      fill="url(#mat-riemann-fill)" />

    <!-- Discrete Riemann Vertical Slices -->
    <g stroke="#0284c7" stroke-width="1" opacity="0.45">
      <rect x="150" y="250" width="30" height="70" fill="none" />
      <rect x="180" y="180" width="30" height="140" fill="none" />
      <rect x="210" y="145" width="30" height="175" fill="none" />
      <rect x="240" y="145" width="30" height="175" fill="none" />
      <rect x="270" y="170" width="30" height="150" fill="none" />
      <rect x="300" y="210" width="30" height="110" fill="none" />
      <rect x="330" y="260" width="30" height="60" fill="none" />
      <rect x="360" y="285" width="30" height="35" fill="none" />
    </g>

    <!-- Integral Interval Boundaries [a, b] -->
    <line x1="150" y1="320" x2="150" y2="335" stroke="#38bdf8" stroke-width="1.8" />
    <text x="146" y="350" fill="#38bdf8" font-size="12" font-weight="700">a</text>
    <line x1="390" y1="320" x2="390" y2="335" stroke="#38bdf8" stroke-width="1.8" />
    <text x="386" y="350" fill="#38bdf8" font-size="12" font-weight="700">b</text>

    <!-- Mathematical Integral Label -->
    <text x="235" y="260" fill="#00e5ff" font-size="13" font-weight="600" opacity="0.85">∫ₐᵇ f(x)dx</text>
  </g>

  <!-- Coordinate Axes with Ticks & Origin -->
  <g stroke="#64748b" stroke-width="1.6" opacity="0.85">
    <!-- X-Axis -->
    <line x1="60" y1="320" x2="520" y2="320" />
    <polygon points="526,320 516,316 516,324" fill="#64748b" />
    <text x="532" y="324" fill="#94a3b8" font-size="12" font-weight="600">x</text>

    <!-- Y-Axis -->
    <line x1="110" y1="380" x2="110" y2="60" />
    <polygon points="110,54 106,64 114,64" fill="#64748b" />
    <text x="106" y="48" fill="#94a3b8" font-size="12" font-weight="600">y</text>

    <!-- Origin (0,0) -->
    <text x="96" y="335" fill="#64748b" font-size="11">0</text>

    <!-- Axis Ticks -->
    <line x1="170" y1="316" x2="170" y2="324" />
    <line x1="230" y1="316" x2="230" y2="324" />
    <line x1="290" y1="316" x2="290" y2="324" />
    <line x1="350" y1="316" x2="350" y2="324" />
    <line x1="410" y1="316" x2="410" y2="324" />
    <line x1="470" y1="316" x2="470" y2="324" />

    <line x1="106" y1="270" x2="114" y2="270" />
    <line x1="106" y1="220" x2="114" y2="220" />
    <line x1="106" y1="170" x2="114" y2="170" />
    <line x1="106" y1="120" x2="114" y2="120" />
  </g>

  <!-- Primary Function Curve: f(x) -->
  <path d="M 75 350 C 130 330, 160 250, 205 160 C 240 90, 280 130, 320 230 C 355 320, 420 340, 495 210"
    fill="none" stroke="url(#mat-curve-grad)" stroke-width="3.2" stroke-linecap="round"
    filter="url(#mat-glow-cyan)" />
  <text x="495" y="195" fill="#00e5ff" font-size="12" font-weight="700">y = f(x)</text>

  <!-- Rigorous Tangent Line at Point P(x₀, y₀) -->
  <g filter="url(#mat-glow-amber)">
    <line x1="120" y1="290" x2="320" y2="70" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />
    <text x="325" y="75" fill="#fbbf24" font-size="11" font-weight="600">dy/dx</text>

    <!-- Differential Triangle dx & dy -->
    <path d="M 230 170 L 280 170 L 280 115" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3 2.5" opacity="0.9" />
    <text x="250" y="185" fill="#f59e0b" font-size="10" font-weight="600">dx</text>
    <text x="286" y="145" fill="#f59e0b" font-size="10" font-weight="600">dy</text>

    <!-- Tangent Point P -->
    <circle cx="230" cy="170" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.8" />
    <text x="210" y="160" fill="#fbbf24" font-size="11" font-weight="700">P(x₀, y₀)</text>
  </g>

  <!-- Critical Points (Local Extrema) -->
  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="238" cy="120" r="4" fill="#00e5ff" />
    <circle cx="362" cy="285" r="4" fill="#00e5ff" />
  </g>
  <text x="245" y="112" fill="#94a3b8" font-size="9" font-weight="600">f'(x)=0</text>
  <text x="372" y="295" fill="#94a3b8" font-size="9" font-weight="600">f'(x)=0</text>
</svg>
